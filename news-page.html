<!DOCTYPE html>
<html lang="te-IN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>తాజా వార్తలు - నెక్స్లిఫై న్యూక్లియస్ | Nexlify Nucleus News</title>
    
    <!-- Stylish Telugu Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ramabhadra&family=Hind+Guntur:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                cyan: '#06b6d4',
                blue: '#1e40af',
                dark: '#020617',
              }
            },
            fontFamily: {
              telugu: ['Hind Guntur', 'sans-serif'],
              display: ['Ramabhadra', 'sans-serif'],
            }
          }
        }
      }
    </script>

    <style>
        body {
            background-color: #f1f5f9;
            color: #1e293b;
        }

        /* Blogger Style News Cards */
        .news-card {
            background: white;
            border-radius: 1rem;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
            border-bottom: 4px solid transparent;
        }

        .news-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
        }

        /* Category Based Headline Colors */
        .cat-local { color: #ea580c; border-color: #ea580c; }
        .cat-national { color: #1e40af; border-color: #1e40af; }
        .cat-international { color: #1e3a8a; border-color: #1e3a8a; }
        .cat-agriculture { color: #16a34a; border-color: #16a34a; }
        .cat-technology { color: #0891b2; border-color: #0891b2; }
        .cat-general { color: #0f172a; border-color: #0f172a; }

        .category-badge {
            padding: 4px 12px;
            font-size: 0.65rem;
            font-weight: 900;
            border-radius: 6px;
            text-transform: uppercase;
            color: white;
            letter-spacing: 1px;
        }

        #loadingSpinner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5rem 0;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #06b6d4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="font-telugu antialiased">
    <!-- Universal Header & Ticker System -->
    <script src="js/universal-header-ticker.js"></script>

    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="mb-16 text-center">
            <h1 class="text-4xl md:text-5xl font-display text-brand-dark mb-4">తాజా వార్తలు (Latest News)</h1>
            <p class="text-slate-500 font-telugu text-lg">నెక్స్లిఫై న్యూక్లియస్ - ముత్తారం మరియు పరిసర ప్రాంతాల ఎప్పటికప్పుడు వార్తలు.</p>
        </div>

        <div id="loadingSpinner">
            <div class="spinner mb-4"></div>
            <p class="text-slate-500 font-telugu">వార్తలు లోడ్ అవుతున్నాయి...</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10" id="newsGrid" style="display: none;">
            <!-- News cards will be loaded here -->
        </div>

        <div id="noNews" class="hidden text-center py-20 bg-white rounded-3xl border-2 border-dashed border-slate-200">
            <i class="fas fa-newspaper text-6xl text-slate-200 mb-6"></i>
            <h3 class="text-xl font-bold font-telugu text-slate-400">ప్రస్తుతానికి వార్తలు ఏవీ లేవు.</h3>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://ndorwpcjwzvygvrstdks.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5kb3J3cGNqd3p2eWd2cnN0ZGtzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU0MDEyOTMsImV4cCI6MjA5MDk3NzI5M30.eUISNWLqFwZG9IKCZSXn9tC9RyRWdGbn-9j0jYAfPxQ';
        
        let supabaseClient;
        try {
            supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } catch (e) {
            console.error('Supabase Error:', e);
        }

        function getCategoryClass(category) {
            const cat = (category || '').toLowerCase();
            if (cat.includes('local')) return 'cat-local';
            if (cat.includes('nation')) return 'cat-national';
            if (cat.includes('intern')) return 'cat-international';
            if (cat.includes('agri')) return 'cat-agriculture';
            if (cat.includes('tech')) return 'cat-technology';
            return 'cat-general';
        }

        function getCategoryColor(category) {
            const cat = (category || '').toLowerCase();
            if (cat.includes('local')) return 'bg-orange-500';
            if (cat.includes('nation')) return 'bg-blue-600';
            if (cat.includes('intern')) return 'bg-blue-800';
            if (cat.includes('agri')) return 'bg-green-600';
            if (cat.includes('tech')) return 'bg-cyan-600';
            return 'bg-slate-800';
        }

        async function fetchNews() {
            const grid = document.getElementById('newsGrid');
            const spinner = document.getElementById('loadingSpinner');
            const noNews = document.getElementById('noNews');

            try {
                const { data, error } = await supabaseClient
                    .from('news')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                spinner.style.display = 'none';

                if (!data || data.length === 0) {
                    noNews.classList.remove('hidden');
                    return;
                }

                grid.style.display = 'grid';
                grid.innerHTML = data.map(news => {
                    const catClass = getCategoryClass(news.category);
                    const catColor = getCategoryColor(news.category);
                    
                    return `
                    <article class="news-card group ${catClass}">
                        <a href="news-detail.html?id=${news.id}" class="block">
                            <div class="aspect-[4/3] relative overflow-hidden">
                                <img src="${news.image_url || 'https://images.unsplash.com/photo-1585829365234-781fcd5013d2?auto=format&fit=crop&q=80&w=600'}" 
                                     class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700" />
                                <span class="absolute top-4 left-4 category-badge ${catColor} shadow-lg">
                                    ${news.category || 'వార్తలు'}
                                </span>
                            </div>
                            <div class="p-6">
                                <div class="flex items-center gap-2 text-[10px] text-slate-400 font-bold uppercase mb-4 tracking-widest">
                                    <i class="far fa-calendar-alt"></i>
                                    <span>${new Date(news.created_at).toLocaleDateString('te-IN')}</span>
                                    <span>•</span>
                                    <i class="fas fa-map-marker-alt"></i>
                                    <span>${news.location || 'ముత్తారం'}</span>
                                </div>
                                <h3 class="text-xl font-display leading-snug mb-4 line-clamp-2">
                                    ${news.title}
                                </h3>
                                <p class="text-slate-500 text-sm font-telugu line-clamp-3 mb-6 leading-relaxed">
                                    ${news.content ? news.content.substring(0, 120) + '...' : ''}
                                </p>
                                <div class="flex items-center justify-between pt-4 border-t border-slate-50">
                                    <span class="font-display text-xs uppercase tracking-widest">చదవండి (READ MORE)</span>
                                    <i class="fas fa-arrow-right text-xs group-hover:translate-x-2 transition-transform"></i>
                                </div>
                            </div>
                        </a>
                    </article>
                `}).join('');

            } catch (err) {
                console.error('Fetch Error:', err);
                spinner.innerHTML = `<p class="text-red-500 font-telugu">వార్తలను లోడ్ చేయడంలో విఫలమైంది.</p>`;
            }
        }

        window.onload = fetchNews;
    </script>
</body>
</html>
